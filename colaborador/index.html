*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,#FFE3CC 0%,#FFFCF8 55%);color:#211B16;font-family:'Glora',system-ui,sans-serif}
.card{max-width:460px;width:100%;background:rgba(255,252,248,.85);border:1px solid #E7E0D5;border-radius:20px;padding:36px 32px;box-shadow:0 30px 60px -30px rgba(33,27,22,.35)}
.card img{height:30px;width:auto;display:block;margin-bottom:28px}
.mono{font-family:ui-monospace,'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#CC5200}
h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:10px 0 12px}
h1 em{font-style:normal;color:#FF6600}
p{opacity:.8;line-height:1.55}
a{display:inline-block;margin-top:24px;padding:12px 18px;border-radius:999px;background:#211B16;color:#FFFCF8;text-decoration:none;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
